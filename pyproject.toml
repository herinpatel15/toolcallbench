[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "toolcallbench"
dynamic = ["version"]
description = "Benchmark how reliably local LLMs call tools on your own repo and hardware"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Herin Patel", email = "herinpatel15113@gmail.com" }]
keywords = ["llm", "benchmark", "tool-calling", "ollama", "function-calling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4",
    "pytest>=7",  # the benchmark's fixture repository is checked by running its tests
]

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://github.com/herinpatel15/toolcallbench"
Issues = "https://github.com/herinpatel15/toolcallbench/issues"

[project.scripts]
toolcallbench = "toolcallbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "toolcallbench.__version__" }

[tool.setuptools.package-data]
toolcallbench = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", "data", ".git", "results"]
addopts = "-q"
