id: nested-02
group: nested
title: Change two settings with one set_json_values call
tools_named: true
optional: true
extra_tools: [set_json_values]
prompt: |
  Use the set_json_values tool, once, to change loan_days to 21 and max_loans_per_member to 5
  in config/settings.json.
expect:
  calls:
    - tool: set_json_values
      args: {path: config/settings.json}
  forbidden_tools: [edit_file, apply_patch]
  max_calls: 4
  final_files:
    config/settings.json:
      contains: ['"loan_days": 21', '"max_loans_per_member": 5']
      not_contains: ['"loan_days": 14', '"max_loans_per_member": 3']
  command:
    - argv: [python, -c, "import json; d = json.load(open('config/settings.json')); assert d['loan_days'] == 21 and d['max_loans_per_member'] == 5 and d['late_fee_per_day'] == 0.25"]
reference:
  - calls:
      - {tool: read_file, args: {path: config/settings.json}}
  - calls:
      - tool: set_json_values
        args:
          path: config/settings.json
          updates:
            - {key_path: [loan_days], value: 21}
            - {key_path: [max_loans_per_member], value: 5}
  - final: Set loan_days to 21 and max_loans_per_member to 5.
